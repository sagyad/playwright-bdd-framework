# CI/CD pipeline — runs Playwright BDD tests on every push and pull request
# Generates Allure report and deploys to GitHub Pages

name: Playwright BDD Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Required for GitHub Pages deployment
    permissions:
      contents: write
      pages: write

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js runtime
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Install Playwright browsers and system dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Create .env file for CI environment
      - name: Create .env file
        run: |
          echo "BASE_URL=https://www.saucedemo.com" > .env
          echo "BROWSER=chromium" >> .env
          echo "HEADLESS=true" >> .env

      # Run the Cucumber BDD tests
      - name: Run tests
        run: npm test
        continue-on-error: true

      # Debug — check if allure-results were generated
      - name: Check Allure results
        if: always()
        run: |
          echo "Checking allure-results directory:"
          ls -la allure-results/ || echo "allure-results directory not found"

      # Upload Allure results as artifact for reporting
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # Upload Cucumber HTML report as artifact
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      # Get Allure history from gh-pages branch
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # Copy previous history if it exists
      - name: Copy Allure history
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/* allure-results/history/ 2>/dev/null || echo "No previous history"

      # Generate Allure report
      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 10

      # Deploy the Allure report to GitHub Pages
      - name: Deploy Allure to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history