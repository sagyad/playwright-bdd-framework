
          # CI/CD pipeline — runs Playwright BDD tests on every push and pull request
          # Generates Allure report and deploys to GitHub Pages

          name: Playwright BDD Tests

          on:
            workflow_dispatch:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              permissions:
                contents: write
                pages: write

              steps:
                # Checkout the repository code
                - name: Checkout code
                  uses: actions/checkout@v4

                # Set up Node.js runtime
                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 18
                    cache: "npm"

                # Install project dependencies
                - name: Install dependencies
                  run: npm ci

                # Install Playwright browsers and system dependencies
                - name: Install Playwright browsers
                  run: npx playwright install --with-deps chromium

                # Create .env file for CI environment
                - name: Create .env file
                  run: |
                    echo "BASE_URL=https://www.saucedemo.com" > .env
                    echo "BROWSER=chromium" >> .env
                    echo "HEADLESS=true" >> .env

                # Run the Cucumber BDD tests
                - name: Run tests
                  run: npm test
                  continue-on-error: true

                # Upload Cucumber HTML report as artifact
                - name: Upload Cucumber report
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: cucumber-report
                    path: reports/
                    retention-days: 30
                    if-no-files-found: warn

                # Upload Allure results as artifact
                - name: Upload Allure results
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: allure-results
                    path: allure-results/
                    retention-days: 30
                    if-no-files-found: warn

                # Install Java (required by Allure CLI)
                - name: Setup Java
                  if: always()
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: 17

                # Install Allure CLI
                - name: Install Allure CLI
                  if: always()
                  run: npm install -g allure-commandline

                # Get previous Allure history from gh-pages
                - name: Check Allure results
                  if: always()
                  run: |
                    echo "=== allure-results directory ==="
                    ls -la allure-results/ 2>/dev/null || echo "MISSING: allure-results folder not found"
                    echo "=== reports directory ==="
                    ls -la reports/ 2>/dev/null || echo "MISSING: reports folder not found"
                    echo "=== cucumber.js config ==="
                    cat cucumber.js

                # Generate Allure report
                - name: Generate Allure report
                  if: always()
                  run: allure generate allure-results --clean -o allure-report

                # Prepare deployment folder with history
                - name: Prepare GitHub Pages
                  if: always()
                  run: |
                    mkdir -p allure-deploy
                    cp -r allure-report/* allure-deploy/
                    cp -r allure-report/history allure-deploy/ 2>/dev/null || true

                # Deploy the Allure report to GitHub Pages
                - name: Deploy Allure to GitHub Pages
                  if: always() && github.ref == 'refs/heads/main'
                  uses: peaceiris/actions-gh-pages@v4
                  with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: allure-deploy

